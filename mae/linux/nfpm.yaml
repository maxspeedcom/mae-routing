# nfpm config for the .deb and .rpm packages (build-linux.sh fills ARCH, VERSION, SRC)
name: mae-routing
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: "${BUILD}"
section: net
priority: optional
maintainer: MAE Routing <support@maesuaisystem.com>
description: |
  MAE Routing: connect this machine to your organisation's private network
  (routing.maesuaisystem.com). WireGuard-based mesh VPN, based on Tailscale.
vendor: MAE Routing
homepage: https://routing.maesuaisystem.com/
license: BSD-3-Clause
conflicts:
  - tailscale
contents:
  - src: ${SRC}/mae-routing
    dst: /usr/bin/mae-routing
  - src: ${SRC}/mae-routingd
    dst: /usr/sbin/mae-routingd
  - src: ${SRC}/mae-routingd.service
    dst: /lib/systemd/system/mae-routingd.service
  - src: ${SRC}/mae-routingd.defaults
    dst: /etc/default/mae-routingd
    type: config|noreplace
  - src: ${SRC}/LICENSE-tailscale.txt
    dst: /usr/share/doc/mae-routing/LICENSE-tailscale.txt
  - dst: /var/lib/mae-routing
    type: dir
    file_info:
      mode: 0700
scripts:
  postinstall: ${SCRIPTS}/postinstall.sh
  preremove: ${SCRIPTS}/preremove.sh
